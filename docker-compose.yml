services:
  gutter:
    build: .
    image: gutter:latest
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "3000:3000"
    volumes:
      - gutter-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # networks:
    #   - comics

volumes:
  gutter-data:

